name: Release Please

on:
  push:
    branches:
      - master
  # Safety net: merges performed with GITHUB_TOKEN (e.g. dependabot auto-merge)
  # do not emit push events for workflows, so we also run on a daily schedule.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions: {}

# Push and schedule triggers can overlap; never run two release-please
# instances at the same time.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # PAT instead of GITHUB_TOKEN so that:
          # - the e2e test workflow runs on the release PR
          # - the published release triggers publish-release.yml
          token: ${{ secrets.CR_PAT }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.CR_PAT }}
          fetch-depth: 0

      # release-please force-pushes the release branch on every update, so the
      # upstream notes are re-added each time it rewrites CHANGELOG.md.
      - name: Add upstream n8n release notes to the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.CR_PAT }}
        run: |
          last_tag=$(git show origin/master:.release-please-manifest.json | jq -r '."."')
          n8n_version() { sed -n -E 's|^FROM n8nio/n8n:([^ ]+).*|\1|p'; }
          prev=$(git show "$last_tag:Dockerfile" | n8n_version)
          new=$(n8n_version < Dockerfile)
          .github/scripts/n8n-release-notes.sh "$prev" "$new" CHANGELOG.md
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: add upstream n8n release notes"
          git push

      # Zero-touch releases: enable auto-merge on the release PR so it merges
      # on its own once the e2e checks pass. Merging cuts the tag and publishes
      # the release, which triggers publish-release.yml.
      - name: Enable auto-merge on the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.CR_PAT }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: gh pr merge "$(echo "$PR_JSON" | jq -r '.number')" --repo "$GITHUB_REPOSITORY" --auto --squash
